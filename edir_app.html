<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ቅዱስ ሩፋኤል አካባቢ ነዋሪዎች መረዳጃ ዕድር</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ቅዱስ ሩፋኤል ዕድር">
<meta name="theme-color" content="#163A24">
<!-- href is set at runtime via JS (setupInstall()) to a Blob URL built from
     the org name + embedded logo, since this is a single portable HTML file
     with no separate manifest.json hosted alongside it. -->
<link rel="manifest" id="app-manifest">
<link rel="apple-touch-icon" id="apple-touch-icon">
<!-- Best-effort hints against caching a stale copy of this file. Not every
     host respects <meta> cache directives (real HTTP headers win when
     present), which is exactly why the JS auto-update checker below exists
     as the reliable mechanism — these tags just help where they can. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
  :root{
    --bg:#FBF3E0; --panel:#FFFDF7; --sidebar:#163A24; --sidebar-active:#2C5C3C;
    --gold:#C9962B; --gold-light:#F4E4BE; --red:#A33A2E; --green-soft:#8FAF93;
    --green-soft-dark:#75987A; --border:#E6DAB8; --text:#2A2A22; --muted:#7A7362; --heading:#163A24;
    --shadow:0 2px 10px rgba(30,25,10,0.08); --soft-panel-bg:#FAF6EA; --track-bg:#F0E9D4; --icon-bg-1:#EAF2EC; --icon-bg-2:#FBF0DC; --icon-bg-3:#FBE7E4;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  html, body{height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto;}
  body{margin:0;font-family:"Noto Sans Ethiopic","Nyala","Abyssinica SIL",sans-serif;background:var(--bg);color:var(--text);}
  /* Font-size control (below) sets document.body.style.zoom in JS rather than
     a CSS variable, because this stylesheet's font-sizes are fixed px values
     (not em/rem) — zoom scales the whole rendered page (text, padding,
     layout) together while preserving normal document flow and native
     scrolling, unlike transform:scale which clips/misaligns scroll regions. */
  #app{display:flex;min-height:100vh;}
  /* ---------- Font-size control widget ---------- */
  #font-ctrl{position:fixed;left:14px;bottom:14px;z-index:60;display:flex;align-items:center;gap:2px;background:var(--panel);border:1.5px solid var(--border);border-radius:30px;box-shadow:var(--shadow);padding:4px;}
  #font-ctrl button{width:34px;height:34px;border-radius:50%;border:none;background:var(--panel);color:var(--heading);font-weight:800;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  #font-ctrl button:hover{background:var(--gold-light);}
  #font-ctrl .fc-label{font-size:11px;color:var(--muted);padding:0 4px;min-width:30px;text-align:center;}
  body.dark-mode #font-ctrl{background:#212820;}
  /* ---------- Landing ---------- */
  #landing{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .landing-card{background:var(--panel);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);max-width:430px;width:100%;padding:36px 28px;text-align:center;}
  .logo-circle{width:88px;height:88px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:0 4px 14px rgba(180,120,20,.35);border:2px solid var(--gold);}
  .logo-circle img{width:100%;height:100%;object-fit:cover;}
  .side-logo img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
  .landing-title{font-size:22px;font-weight:800;color:var(--heading);margin:0 0 4px;}
  .landing-sub{font-size:14px;color:var(--red);font-weight:700;margin:0 0 14px;}
  .progress-flag{height:5px;border-radius:4px;background:linear-gradient(90deg,#1B5E36 33%,var(--gold) 33% 66%,var(--red) 66%);margin:16px 0 26px;}
  .role-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:14px 16px;border-radius:12px;border:1.5px solid var(--border);background:var(--panel);margin-bottom:12px;cursor:pointer;transition:.15s;}
  .role-btn:hover{border-color:var(--gold);background:var(--gold-light);}
  .role-icon{font-size:22px;flex:0 0 auto;}
  .role-text{flex:1;text-align:right;}
  .role-title{font-weight:700;font-size:15px;color:var(--heading);}
  .role-desc{font-size:12px;color:var(--muted);}
  .landing-links{margin-top:10px;font-size:13px;}
  .landing-links a{color:var(--red);text-decoration:underline;cursor:pointer;}
  .share-btn{margin-top:16px;width:100%;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:var(--panel);cursor:pointer;font-size:14px;color:var(--heading);font-weight:600;}
  /* ---------- Sidebar ---------- */
  .sidebar{width:230px;background:var(--sidebar);color:#eee;flex:0 0 auto;display:flex;flex-direction:column;padding:18px 12px;min-height:100vh;position:sticky;top:0;align-self:flex-start;}
  .sidebar.collapsed{display:none;}
  .side-brand{display:flex;gap:10px;align-items:center;padding:6px 6px 16px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px;}
  .side-logo{width:38px;height:38px;border-radius:50%;background:var(--gold);color:#1c3320;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:0 0 auto;}
  .side-org{font-size:13px;font-weight:700;line-height:1.3;}
  .role-badge{display:inline-block;margin-top:4px;font-size:10px;background:rgba(255,255,255,.14);padding:2px 8px;border-radius:20px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px;margin-bottom:4px;color:#e9e9e2;}
  .nav-item:hover{background:rgba(255,255,255,.08);}
  .nav-item.active{background:var(--sidebar-active);color:#fff;font-weight:700;}
  .nav-icon{font-size:16px;width:20px;text-align:center;}
  .side-bottom{margin-top:auto;padding-top:10px;border-top:1px solid rgba(255,255,255,.12);}
  .side-link{font-size:12px;color:#cfd6cf;cursor:pointer;padding:8px 6px;display:block;}
  .install-btn{display:flex;align-items:center;gap:8px;background:var(--gold);color:#1c3320;border:none;border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:700;cursor:pointer;width:100%;margin-bottom:6px;}
  #update-banner{position:fixed;top:0;left:0;right:0;z-index:300;background:#163A24;color:#fff;display:none;align-items:center;justify-content:center;gap:14px;padding:10px 16px;font-size:13px;box-shadow:0 3px 14px rgba(0,0,0,.25);flex-wrap:wrap;}
  #update-banner button{background:var(--gold);color:#1c3320;border:none;border-radius:8px;padding:7px 16px;font-size:12.5px;font-weight:800;cursor:pointer;}
  #update-banner .ub-later{background:transparent;color:#cfe0d3;text-decoration:underline;font-weight:600;padding:6px 4px;}
  @media print{ #update-banner{display:none !important;} }
  .install-btn:hover{filter:brightness(1.05);}
  /* ---------- Main ---------- */
  #main-wrap{flex:1;min-width:0;}
  #topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;}
  .hamburger{display:none;background:none;border:none;font-size:22px;cursor:pointer;color:var(--heading);}
  #main-content{padding:18px 20px 60px;max-width:1200px;}
  .page-eyebrow{font-size:12px;color:var(--gold);font-weight:700;letter-spacing:.03em;margin-bottom:2px;}
  .page-title{font-size:23px;font-weight:800;color:var(--heading);margin:0 0 4px;}
  .page-sub{font-size:13px;color:var(--muted);margin-bottom:10px;}
  .progress-thin{height:4px;border-radius:3px;background:linear-gradient(90deg,#1B5E36 33%,var(--gold) 33% 66%,var(--red) 66%);margin-bottom:18px;}
  .back-btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1.5px solid var(--border);border-radius:9px;padding:7px 14px;font-size:13px;color:var(--heading);font-weight:700;cursor:pointer;margin-bottom:14px;}
  .back-btn:hover{border-color:var(--gold);}
  /* cards */
  .cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
  .stat-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px 14px;box-shadow:var(--shadow);}
  .stat-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:8px;}
  .stat-value{font-size:19px;font-weight:800;color:var(--text);}
  .stat-label{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.3;}
  /* generic panel */
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:18px;}
  .panel-title{font-size:15px;font-weight:800;color:var(--heading);margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;}
  /* buttons */
  .btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:9px;padding:9px 16px;font-size:13.5px;font-weight:700;cursor:pointer;}
  .btn-primary{background:var(--green-soft);color:#183021;}
  .btn-primary:hover{background:var(--green-soft-dark);}
  .btn-gold{background:var(--gold);color:#1c3320;}
  .btn-outline{background:var(--panel);border:1.5px solid var(--border);color:var(--heading);}
  .btn-danger{background:#fdeceb;color:var(--red);border:1px solid #f3c9c5;}
  .btn-sm{padding:5px 9px;font-size:12px;border-radius:7px;}
  .btn-icon{padding:6px 9px;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .search-input,.select-input,.text-input{padding:9px 12px;border-radius:9px;border:1.5px solid var(--border);font-size:13.5px;font-family:inherit;background:var(--panel);color:var(--text);}
  .search-input{flex:1;min-width:160px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--heading);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:9px;border:1.5px solid var(--border);font-size:14px;font-family:inherit;background:#fdfcf8;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  /* table */
  .table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border);}
  .table-wrap.wide-mode table.data-table{min-width:0;font-size:11px;}
  .table-wrap.wide-mode table.data-table th,.table-wrap.wide-mode table.data-table td{padding:5px 6px;}
  table.data-table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px;}
  table.data-table th{background:var(--sidebar);color:#fff;padding:9px 10px;text-align:right;font-size:12.5px;white-space:nowrap;}
  table.data-table td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;}
  table.data-table tbody tr:nth-child(even){background:var(--soft-panel-bg);}
  table.data-table tbody tr:hover{background:var(--gold-light);}
  td.name-cell,th.name-cell{text-align:right;white-space:normal;min-width:130px;}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;}
  .pill-debt{background:#FBE7E4;color:var(--red);}
  .pill-ok{background:#E7F1E8;color:#2E6B3C;}
  .pill-over{background:#FDF2DA;color:#8A6112;}
  .amt-neg{color:var(--red);font-weight:700;}
  .amt-pos{color:#2E6B3C;font-weight:700;}
  .amt-over{color:#8A6112;font-weight:700;}
  .row-actions{display:flex;gap:6px;justify-content:center;}
  .committee-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
  .committee-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow);cursor:pointer;}
  .committee-card:hover{border-color:var(--gold);}
  .committee-card h4{margin:0 0 8px;font-size:14.5px;color:var(--heading);}
  .committee-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);}
  .orientation-hint{display:flex;align-items:center;gap:8px;background:var(--gold-light);border:1px solid #ecd8a4;border-radius:10px;padding:8px 12px;font-size:12.5px;color:#6e5115;margin-bottom:14px;}
  .month-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px;}
  .month-chip{border-radius:9px;padding:8px 6px;text-align:center;font-size:11.5px;border:1.5px solid var(--border);}
  .month-chip.paid{background:#E7F1E8;border-color:#bfe0c4;color:#2E6B3C;}
  .month-chip.unpaid{background:#FBE7E4;border-color:#f3c3bd;color:var(--red);}
  .month-chip .mo{display:block;font-weight:700;margin-bottom:2px;}
  /* modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(20,15,5,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal-box{background:var(--panel);border-radius:16px;max-width:460px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;box-shadow:0 12px 40px rgba(0,0,0,.25);}
  .modal-title{font-size:17px;font-weight:800;color:var(--heading);margin:0 0 14px;}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-close{float:left;background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c3320;color:#fff;padding:11px 20px;border-radius:30px;font-size:13.5px;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.25);}
  .instr-list{padding-right:0;list-style:none;margin:0;}
  .instr-list li{display:flex;gap:10px;margin-bottom:12px;font-size:13.5px;line-height:1.6;}
  .instr-num{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#1c3320;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;}
  .share-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px;}
  .share-opt{display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px solid var(--border);border-radius:12px;padding:12px 8px;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--heading);background:var(--panel);}
  .share-opt:hover{border-color:var(--gold);background:var(--gold-light);}
  .empty-state{text-align:center;padding:40px 12px;color:var(--muted);}
  .print-only{display:none;}
  body.dark-mode{ --bg:#161B14; --panel:#212820; --gold-light:#3A331F; --border:#333B2E; --text:#EDEAE0; --muted:#9CA396; --heading:#7FCB9A; --soft-panel-bg:#262E22; --track-bg:#1C221A; --icon-bg-1:#22321F; --icon-bg-2:#332B18; --icon-bg-3:#332019; }
  body.dark-mode .stat-card, body.dark-mode .panel, body.dark-mode .committee-card, body.dark-mode .modal-box{ background:#212820; }
  body.dark-mode table.data-table tbody tr:nth-child(even){ background:#262E22; }
  body.dark-mode table.data-table tbody tr:hover{ background:#3A331F; }
  body.dark-mode .search-input,body.dark-mode .select-input,body.dark-mode .text-input,body.dark-mode .field input,body.dark-mode .field select,body.dark-mode .field textarea{ background:#1C221A; color:var(--text); border-color:var(--border); }
  body.dark-mode .landing-card{ background:#212820; }
  body.dark-mode .btn-outline{ background:#212820; color:var(--text); }
  body.dark-mode .role-btn{ background:#212820; }
  @media (max-width:880px){
    .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:41;box-shadow:0 0 30px rgba(0,0,0,.35);width:78vw;max-width:290px;}
    .sidebar.mobile-hidden{display:none;}
    .nav-backdrop{display:none;position:fixed;inset:0;background:rgba(10,10,5,.45);z-index:40;}
    .nav-backdrop.show{display:block;}
    .sidebar-close{display:flex;}
    .hamburger{display:inline-block;}
    #main-content{padding:14px 12px 60px;}
    .field-row{grid-template-columns:1fr;}
  }
  .sidebar-close{display:none;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.12);color:#fff;border:none;font-size:18px;cursor:pointer;margin-right:auto;}
  /* Belt-and-suspenders: guarantee the page can always scroll to reveal every
     section, overriding any accidental fixed/limited height the hosting
     environment (iframe, app-builder wrapper, etc.) might otherwise impose. */
  html{ overflow-y: auto !important; height: auto !important; }
  body{ overflow-y: auto !important; height: auto !important; min-height: 100%; }
  #app{ overflow: visible; }
  @media print{
    .sidebar,#topbar,.back-btn,.toolbar,.no-print{display:none !important;}
    body{background:#fff;}
    #main-content{padding:0;max-width:100%;}
    .print-only{display:block;}
  }
</style>
</head>
<body>
<div id="update-banner">
  <span>🔄 አዲስ ዝማኔ ተገኝቷል!</span>
  <button onclick="applyDetectedUpdate()">አሁኑኑ አዘምን</button>
  <span class="ub-later" onclick="dismissUpdateBanner()">በኋላ</span>
</div>
<div id="zoom-wrap">
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
</div>
<div id="font-ctrl" title="የፊደል መጠን / ማሳያ ቀይር">
  <button onclick="adjustFontScale(-1)">A-</button>
  <span class="fc-label" id="fc-label">100%</span>
  <button onclick="adjustFontScale(1)">A+</button>
  <button onclick="adjustFontScale(0)" title="ወደ መደበኛ መጠን መልስ" style="font-size:11px;">↺</button>

const STORAGE_KEY = "edir_db_v2";
// Portable storage layer: inside a Claude artifact, window.storage exists and
// syncs to Claude's servers. Outside Claude (e.g. copied to any free static
// hosting site), window.storage does not exist — so we fall back to the
// browser's own localStorage, which persists normally on that site/device.
// Everything else in the app calls APP_STORAGE the same way either place.
const APP_STORAGE = (typeof window !== "undefined" && window.storage) ? window.storage : {
  async get(key){
    const raw = localStorage.getItem(key);
    if(raw === null) throw new Error("not found");
    return { key, value: raw, shared: false };
  },
  async set(key, value){
    localStorage.setItem(key, value);
    return { key, value, shared: false };
  },
  async delete(key){
    localStorage.removeItem(key);
    return { key, deleted: true, shared: false };
  },
  async list(prefix){
    const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
    return { keys, prefix, shared: false };
  }
};

/* ---------------- Install as app (PWA / Add to Home Screen) ---------------- */
// This single HTML file has no separate manifest.json or service worker file
// living alongside it on whatever site it's hosted on, so we build a minimal
// manifest at runtime (as a Blob URL) using the embedded logo + org name.
// Where the browser supports it (mainly Chrome/Edge/Android), this makes a
// real native "Install" prompt available via the captured beforeinstallprompt
// event. Everywhere else (notably iOS Safari, and desktop Safari/Firefox),
// there's no such API — so the button instead opens a short guide with the
// correct manual "Add to Home Screen" steps for that browser.
let deferredInstallPrompt = null;
function setupInstall(){
  try{
    // Use a clean canonical URL (no ?_v=... cache-busting param that
    // applyDetectedUpdate() may have appended) so the installed app icon
    // always launches at a normal, bookmarkable address.
    const cleanUrl = location.origin + location.pathname;
    const manifest = {
      name: SEED_DATA.settings.orgName,
      short_name: "ዕድር",
      start_url: cleanUrl,
      scope: cleanUrl.slice(0, cleanUrl.lastIndexOf("/") + 1) || cleanUrl,
      display: "standalone",
      background_color: "#FBF3E0",
      theme_color: "#163A24",
      // Real, correctly-sized icons (see ICON_192/512_DATA_URI above) — a
      // declared size that doesn't match the actual image's pixel dimensions
      // is a common, easy-to-miss reason the full "Install app" menu entry
      // fails to appear (browsers fall back to a plain bookmark instead).
      icons: [
        { src: ICON_192_DATA_URI, sizes: "192x192", type: "image/png", purpose: "any" },
        { src: ICON_512_DATA_URI, sizes: "512x512", type: "image/png", purpose: "any" }
      ]
    };
    // Use a data: URI (content-addressed — identical content always produces
    // the identical URL) rather than a blob: URL (which mints a brand-new
    // random URL every single page load). This matters a lot in practice:
    // Chrome's Android "promote from bookmark to full Install app entry"
    // heuristic tracks engagement against a *stable* manifest identity across
    // separate visits — a manifest URL that changes on every load can
    // prevent that engagement from ever accumulating, leaving only the
    // plain "Add to Home Screen" bookmark option in the ⋮ menu forever.
    const manifestUrl = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(manifest));
    const link = document.getElementById("app-manifest");
    if(link) link.href = manifestUrl;
    const touchIcon = document.getElementById("apple-touch-icon");
    if(touchIcon) touchIcon.href = ICON_192_DATA_URI;
  }catch(e){ console.error("manifest setup failed", e); }
  registerServiceWorker();
}
// Optional: if a companion sw.js file has been uploaded alongside this HTML
// file on the same host, this registers it for offline support and stronger
// installability. If sw.js isn't present (a single-file-only deployment),
// registration simply fails silently here and everything else (the install
// button's native prompt / manual guide, and the in-page auto-update
// banner) keeps working exactly the same either way.
function registerServiceWorker(){
  if(!("serviceWorker" in navigator)) return;
  if(location.protocol === "file:") return; // service workers require http(s)
  const swUrl = location.origin + location.pathname.replace(/[^/]*$/, "") + "sw.js";
  navigator.serviceWorker.register(swUrl).then(()=>{
    // A controller change means a new SW version just took over — since our
    // sw.js is network-first for navigation anyway, a reload here is cheap
    // and guarantees the freshest shell + assets are in play together.
    let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", ()=>{
      if(reloaded) return;
      reloaded = true;
    });
  }).catch(()=>{ /* no sw.js on this host — fine, everything else still works */ });
}
function isStandalone(){
  return window.matchMedia && window.matchMedia("(display-mode: standalone)").matches
    || window.navigator.standalone === true; // iOS Safari's own flag
}
function updateInstallButtons(){
  const show = !isStandalone();
  ["install-btn-landing","install-btn-sidebar"].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.style.display = show ? "flex" : "none";
  });
}
window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  updateInstallButtons();
});
window.addEventListener("appinstalled", ()=>{
  deferredInstallPrompt = null;
  updateInstallButtons();
  showToast && showToast("✅ መተግበሪያው ተጭኗል!");
});
async function handleInstallClick(){
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    try{ await deferredInstallPrompt.userChoice; }catch(e){}
    deferredInstallPrompt = null;
    updateInstallButtons();
    return;
  }
  openInstallGuideModal();
}
function detectPlatform(){
  const ua = navigator.userAgent || "";
  if(/iPhone|iPad|iPod/.test(ua)) return "ios";
  if(/Android/.test(ua)) return "android";
  return "desktop";
}

/* ---------------- Auto-update checker ---------------- */
// This is a single static HTML file with no server backend and (per the
// Service Worker spec) no way to register a service worker from a blob:/
// data: URL — so a "real" PWA auto-update pipeline (service worker fetching
// and swapping a new cached app shell) is not achievable here. What IS
// achievable, and is implemented below: periodically re-fetch this same
// file fresh from wherever it's hosted (bypassing cache), read the
// APP_VERSION baked into that fresh copy, and if it's newer than the
// version currently running, offer a one-tap reload. This works whether
// the app is open in a normal tab or installed/standalone, as long as the
// browser can reach the file's own URL (skipped gracefully — no visible
// error — when that isn't possible, e.g. a file:// origin during local
// testing, or a fully offline device).
const UPDATE_CHECK_INTERVAL_MS = 10 * 60 * 1000; // every 10 minutes while open
const UPDATE_DISMISS_KEY = "edir_update_dismissed_version";
function compareVersions(a, b){
  const pa = String(a).split(".").map(n=>parseInt(n,10)||0);
  const pb = String(b).split(".").map(n=>parseInt(n,10)||0);
  for(let i=0;i<Math.max(pa.length,pb.length);i++){
    const x = pa[i]||0, y = pb[i]||0;
    if(x !== y) return x - y;
  }
  return 0;
}
let DETECTED_NEW_VERSION = null;
async function checkForUpdate(){
  try{
    const res = await fetch(location.href, { cache: "no-store" });
    if(!res.ok) return;
    const text = await res.text();
    const m = text.match(/const APP_VERSION\s*=\s*"([\d.]+)"/);
    if(!m) return;
    const remoteVersion = m[1];
    if(compareVersions(remoteVersion, APP_VERSION) > 0){
      const dismissed = localStorage.getItem(UPDATE_DISMISS_KEY);
      if(dismissed === remoteVersion) return; // person already said "later" for this exact version
      DETECTED_NEW_VERSION = remoteVersion;
      const banner = document.getElementById("update-banner");
      if(banner) banner.style.display = "flex";
    }
  }catch(e){ /* offline, blocked by CORS on this host, or file:// — fail silently */ }
}
function applyDetectedUpdate(){
  // Force-bypass any cached copy by cache-busting the URL, then hard-reload.
  const url = new URL(location.href);
  url.searchParams.set("_v", String(Date.now()));
  location.href = url.toString();
}
function dismissUpdateBanner(){
  if(DETECTED_NEW_VERSION) localStorage.setItem(UPDATE_DISMISS_KEY, DETECTED_NEW_VERSION);
  const banner = document.getElementById("update-banner");
  if(banner) banner.style.display = "none";
}
function startAutoUpdateChecks(){
  setTimeout(checkForUpdate, 4000); // small delay so it never competes with initial load
  setInterval(checkForUpdate, UPDATE_CHECK_INTERVAL_MS);
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "visible") checkForUpdate(); });
  window.addEventListener("focus", checkForUpdate);
}

const ETH_MONTHS = ["መስከረም","ጥቅምት","ህዳር","ታህሳስ","ጥር","የካቲት","መጋቢት","ሚያዝያ","ግንቦት","ሰኔ","ሐምሌ","ነሐሴ","ጳጉሜ"];
// Approximate Ethiopian → Gregorian correspondence (accurate to within ~1 day around
// each Ethiopian month's start; good enough for a side-by-side reference display,
// not for legal/precise use). Each entry: [Gregorian month name, year offset from
// the Ethiopian year — ወራት 1-4 fall in the same Gregorian year as (ethYear+7),
// ወራት 5-13 fall in (ethYear+8)].
const GREG_MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const ETH_TO_GREG = [
  [8, 7],  // መስከረም → September, +7
  [9, 7],  // ጥቅምት → October, +7
  [10, 7], // ህዳር → November, +7
  [11, 7], // ታህሳስ → December, +7
  [0, 8],  // ጥር → January, +8
  [1, 8],  // የካቲት → February, +8
  [2, 8],  // መጋቢት → March, +8
  [3, 8],  // ሚያዝያ → April, +8
  [4, 8],  // ግንቦት → May, +8
  [5, 8],  // ሰኔ → June, +8
  [6, 8],  // ሐምሌ → July, +8
  [7, 8],  // ነሐሴ → August, +8
  [8, 8],  // ጳጉሜ → September, +8
];
function gregApprox(ethYear, ethMonth){
  const idx = ETH_MONTHS.indexOf(ethMonth);
  if(idx < 0) return "";
  const [gm, offset] = ETH_TO_GREG[idx];
  return `${GREG_MONTH_NAMES[gm]} ${ethYear + offset} GC`;
}

}

var DB = null;

function uid(p){ return p + Math.random().toString(36).slice(2,9); }
// PINs are never stored or transmitted in plain text — only a per-admin
// random salt + the SHA-256 hash of (salt + pin) is kept. Checking a PIN
// means re-hashing the entered value with that admin's salt and comparing
// hashes; there is no way to recover the original PIN from what's stored,
// by design (that's what "hashing" means — it's one-way).
async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function randomSalt(len){
  const arr = new Uint8Array(len||8);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function hashPin(pin, salt){
  return sha256Hex(salt + ":" + String(pin).trim().toLowerCase());
}
// One-time migration: any admin record still holding a plaintext `pin`
// (from an old backup/seed) gets it replaced with salt+hash, and the
// plaintext field is deleted so it no longer exists anywhere in the data.
async function fixupAdminPinHashes(){
  let changed = false;
  for(const a of (DB.admins||[])){
    if(a.pin && !a.pinHash){
      const salt = randomSalt();
      a.pinHash = await hashPin(a.pin, salt);
      a.salt = salt;
      delete a.pin;
      changed = true;
    }
  }
  return changed;
}

function fixupMikaelReconciliation(){
  // Historical migration: the 1,050 ብር "reconciliation adjustment" line was an
  // earlier workaround for Kidus Mikael members' ጥር payments being mis-dated.
  // Since those payment records are now correctly dated ታህሳስ at the source,
  // the separate adjustment is redundant — fold its amount into the old
  // committee's expense total (135,120 = 134,070 + 1,050) and remove it, so
  // the reconciliation panel's category math (old/new) stays correct instead
  // of double-counting the same 1,050 ብር in two places.
  DB.expenses = DB.expenses || [];
  const adj = DB.expenses.find(e=>e.category==="adjustment" && e.amount===1050);
  const old = DB.expenses.find(e=>e.category==="old");
  if(!adj) return false;
  if(old) old.amount = (old.amount||0) + 1050;
  DB.expenses = DB.expenses.filter(e=>e.id!==adj.id);
  return true;
}

async function fixupAdmins(){

// Backfills the "category" field (old / new / adjustment) on expense records
// that were saved before this field existed, so the old-vs-new committee
// reconciliation panel doesn't silently show 0 for everyone's expenses.
function fixupExpenseCategories(){
  DB.expenses = DB.expenses || [];
  let changed = false;
  DB.expenses.forEach(e=>{
    if(e.category) return;
    if(e.type === "የሂሳብ ርክክብ ማስተካከረያ" || e.type === "የሂሳብ ርክክብ ማስተካከያ"){ e.category = "adjustment"; changed = true; return; }
    if(e.amount === 134070 || (e.note||"").indexOf("ነባር ኮሚቴ ጠቅላላ")!==-1){ e.category = "old"; changed = true; return; }
    // default: anything else (including the seeded April expense and any
    // admin-entered expense) belongs to the new committee's own operations.

}

function paymentsOf(memberId){ return DB.payments.filter(p=>p.memberId===memberId); }
function memberPaid(memberId){ return paymentsOf(memberId).reduce((a,p)=>a+p.amount,0); }

function monthIdx(y, m){ return y*13 + ETH_MONTHS.indexOf(m); }
function fmtEntryTime(ts){
  if(!ts) return "";
  const d = new Date(ts);
  const now = new Date();
  const diffDays = Math.floor((now.setHours(0,0,0,0) - new Date(d).setHours(0,0,0,0)) / 86400000);
  const time = d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  if(diffDays===0) return `🕐 ዛሬ ${time} የገባ`;
  if(diffDays===1) return `🕐 ትናንት ${time} የገባ`;
  return `🕐 ${d.toLocaleDateString("en-GB")} የገባ`;
}
// True-entry-order sort: newly submitted records (which carry a real
// enteredAt timestamp) sort by actual entry recency first; older bulk
// records without a timestamp fall back to due-month ordering.
function sortByEntryThenMonth(list){
  return list.slice().sort((a,b)=>{
    const ka = a.enteredAt||0, kb = b.enteredAt||0;
    if(ka !== kb) return kb - ka;
    return monthIdx(b.year,b.month) - monthIdx(a.year,a.month);
  });
}

// Dynamic "ትርፍ ክፍያ / ውዝፍ ዕዳ" calculator: computes how much a member SHOULD have
// paid to date (as of the given target year/month), taking into account the two
// special hand-over cases (ዳንኤል የኔሰው, አየነው ልመንህ) exactly as specified.
function monthlyExpected(m, targetY, targetM){
  const targetIdx = monthIdx(targetY, targetM);
  const fee = DB.settings.monthlyFee;
  if(m.specialSchedule === "daniel"){
    const start = monthIdx(2018, "ጥቅምት");     // ጥቅምት 2018 - joined
    const tahsas = monthIdx(2018, "ታህሳስ");     // end of introductory 3-month period
    if(targetIdx < start) return 0;
    if(targetIdx <= tahsas){
      const n = targetIdx - start + 1;          // 1..3
      return 500 + n*50;                        // 500 መግቢያ + 50/ወር
    }
    const monthsAfter = targetIdx - tahsas;      // months since ታህሳስ
    return 650 + monthsAfter*100;                // 650 base + 100/ወር
  }
  if(m.specialSchedule === "ayenew"){
    const start = monthIdx(2018, "መጋቢት");      // መጋቢት 2018 - joined
    if(targetIdx < start) return 0;
    const n = targetIdx - start + 1;             // 1 at መጋቢት, 2 at ሚያዝያ, ...
    return 500 + n*100;                          // 500 መግቢያ + 100/ወር
  }
  // መደበኛ አባላት: baseline (እንደ baselineDate ያለ) + ወርሃዊ 100 ብር እድገት
  const baseIdx = monthIdx(m.baselineDate.y, m.baselineDate.m);
  const monthsElapsed = targetIdx - baseIdx;
  return m.baselineExpected + fee*monthsElapsed;
}

function memberStats(m, atY, atM){
  const y = atY !== undefined ? atY : DB.settings.currentYear;
  const mo = atM !== undefined ? atM : DB.settings.currentMonth;
  const paid = memberPaid(m.id);
  const expected = monthlyExpected(m, y, mo);
  const debt = Math.max(expected - paid, 0);
  const overpay = Math.max(paid - expected, 0);
  return { paid, expected, debt, overpay };
}
function committeeMembers(cid){ return DB.members.filter(m=>m.committeeId===cid); }
function committeeStats(cid){
  const mem = committeeMembers(cid);
  let paid=0, expected=0, debt=0, overpay=0;
  mem.forEach(m=>{ const s=memberStats(m); paid+=s.paid; expected+=s.expected; debt+=s.debt; overpay+=s.overpay; });
  return { count: mem.length, paid, expected, debt, overpay };
}
function totalCollected(){ return DB.payments.reduce((a,p)=>a+p.amount,0); }
function totalExpense(){ return DB.expenses.reduce((a,e)=>a+e.amount,0) + totalSupportPaid(); }
function totalSupportPaid(){ return (DB.supportClaims||[]).reduce((a,s)=>a+s.amount,0); }
function netBalance(){ return totalCollected() - totalExpense(); }
function totalDebt(){ return DB.members.reduce((a,m)=>a+memberStats(m).debt,0); }
function totalOverpay(){ return DB.members.reduce((a,m)=>a+memberStats(m).overpay,0); }

// Splits all money into "የነባር ኮሚቴ" (closed historical period, fixed) vs
// "የአዲስ ኮሚቴ" (ጥር 2018 onward, grows as the current month advances / new
// entries are added). Every payment/expense is dated to when it actually
// happened, so this is a plain date split — no special-casing needed.
function committeeReconciliation(){
  const oldEndIdx = monthIdx(2018, "ታህሳስ");
  const dateIsOld = (year, month) => {
    if(month === "ዓመታዊ") return true;
    return monthIdx(year, month) <= oldEndIdx;
  };
  let oldIncome = 0, newIncome = 0;
  DB.payments.forEach(p=>{ if(dateIsOld(p.year,p.month)) oldIncome += p.amount; else newIncome += p.amount; });

  // Expenses and support payouts are split by date too (not by a "category"
  // field) so this always ties out with the true totals, even for entries
  // added before categories existed or through any future data path.
  let oldExpense = 0, newExpense = 0;
  DB.expenses.forEach(e=>{ if(dateIsOld(e.year,e.month)) oldExpense += e.amount; else newExpense += e.amount; });
  (DB.supportClaims||[]).forEach(s=>{ if(dateIsOld(s.year,s.month)) oldExpense += s.amount; else newExpense += s.amount; });

  const oldNet = oldIncome - oldExpense;
  const newNet = newIncome - newExpense;
  const trueNet = netBalance();
  const computedNet = oldNet + newNet;
  return {
    old: { income: oldIncome, expense: oldExpense, net: oldNet },
    new: { income: newIncome, expense: newExpense, net: newNet },
    grandNet: trueNet, // always the real, authoritative balance
    unexplainedGap: trueNet - computedNet // should be 0; surfaced if not, rather than hidden
  };
}

function inRange(year, month, range){
  // range: {allTime:true} or {year:2018} or {from:{y,m}, to:{y,m}}
  if(range.allTime) return true;
  if(range.year) return year === range.year;
  if(range.from && range.to){
    const idx = (yy,mm)=> yy*13 + ETH_MONTHS.indexOf(mm==="ዓመታዊ"?"መስከረም":mm);
    const v = idx(year, month);
    return v >= idx(range.from.y, range.from.m) && v <= idx(range.to.y, range.to.m);
  }
  return true;
}
function periodIncome(range){ return DB.payments.filter(p=>inRange(p.year,p.month,range)).reduce((a,p)=>a+p.amount,0); }
function periodExpense(range){
  const e = DB.expenses.filter(e=>inRange(e.year,e.month,range)).reduce((a,e)=>a+e.amount,0);
  const s = (DB.supportClaims||[]).filter(s=>inRange(s.year,s.month,range)).reduce((a,s)=>a+s.amount,0);
  return e + s;
}

// Sends a plain "please reset my PIN" request to the app owner/developer
// (always DB.admins[0]) — never includes or displays any PIN value, so this
// cannot be used to read someone else's password.
function requestPinReset(channel){
  const name = document.getElementById("fpName").value.trim();
  if(!name){ showToast("እባክዎ ስምዎን ያስገቡ"); return; }
  const owner = DB.admins[0];
  const msg = `${name} የ${DB.settings.orgName} ፒን ኮድ ረስተዋል/ማደስ ይፈልጋሉ። እባክዎ አዲስ ፒን ኮድ ይስጧቸው።`;
  if(channel==='sms'){
    if(!owner || !owner.phone){ showToast("የመተግበሪያው ባለቤት ስልክ ቁጥር አልተመዘገበም"); return; }
    window.location.href = `sms:${owner.phone}?body=${encodeURIComponent(msg)}`;
  } else {
    if(!owner || !owner.email){ showToast("የመተግበሪያው ባለቤት ኢሜይል አልተመዘገበም"); return; }
    window.location.href = `mailto:${owner.email}?subject=${encodeURIComponent('የፒን ኮድ ማደሻ ጥያቄ')}&body=${encodeURIComponent(msg)}`;
  }
}
async function checkPin(){
  const val = document.getElementById("pinInput").value.trim();
  if(!val) return;
  let matched = null;
  for(const a of DB.admins){
    if(!a.pinHash || !a.salt) continue; // shouldn't happen post-migration, but skip safely
    const h = await hashPin(val, a.salt);
    if(h === a.pinHash){ matched = a; break; }
  }
  if(matched){ STATE.role="admin"; STATE.currentAdminName=matched.name; STATE.currentAdminId=matched.id; closeModal(); setPage("dashboard"); }
  else{ document.getElementById("pinErr").style.display="block"; }
}

function monthlyTrendChart(){
  const curIdx = monthIdx(DB.settings.currentYear, DB.settings.currentMonth);
  const N = 6;
  const bars = [];
  for(let i=N-1;i>=0;i--){
    const v = curIdx - i;
    const y = Math.floor(v/13), mo = ETH_MONTHS[v%13];
    const sum = DB.payments.filter(p=>p.year===y && p.month===mo).reduce((a,p)=>a+p.amount,0);
    bars.push({y,mo,sum});
  }
  const max = Math.max(1, ...bars.map(b=>b.sum));
  const barsHtml = bars.map(b=>{
    const pct = Math.max(2, Math.round(b.sum/max*100));
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;">
      <div style="font-size:10.5px;font-weight:700;color:var(--heading);white-space:nowrap;">${b.sum>0?fmtNum(b.sum):'—'}</div>
      <div style="width:100%;max-width:36px;height:110px;background:var(--track-bg);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden;">
        <div style="width:100%;height:${pct}%;background:linear-gradient(180deg,var(--gold),#1B5E36);border-radius:6px 6px 0 0;"></div>
      </div>
      <div style="font-size:10.5px;color:var(--muted);text-align:center;line-height:1.3;">${b.mo}<br>${b.y}</div>
    </div>`;
  }).join("");
  return `<div class="panel">
    <div class="panel-title">📊 ወርሃዊ የገቢ አዝማሚያ (የመጨረሻዎቹ ${N} ወራት)</div>
    <p style="font-size:11.5px;color:var(--muted);margin-top:-6px;">ብቻ ወርሃዊ ክፍያዎችን ያሳያል (ዓመታዊ የነባር ኮሚቴ ክፍያዎች አልተካተቱም)።</p>
    <div style="display:flex;gap:8px;align-items:flex-end;padding-top:6px;">${barsHtml}</div>
  </div>`;
}

    const y = Math.floor(v/13), mo = ETH_MONTHS[v%13];
    const entries = DB.payments.filter(p=>p.memberId===m.id && p.year===y && p.month===mo);
    const sum = entries.reduce((a,p)=>a+p.amount,0);
    months.push({y,mo,paid:entries.length>0,count:entries.length,sum});
  }
  return `
    <button class="back-btn" onclick="goBack()">← ተመለስ</button>
    <div class="page-eyebrow">${c?c.name:''}</div>
    <div class="page-title">${m.name}</div>

    <div class="cards-row">

function paymentMemberOptions(committeeId, selectedId){
  const mem = DB.members.filter(m=>m.committeeId===committeeId);
  return mem.map(m=>`<option value="${m.id}" ${m.id===selectedId?'selected':''}>${m.name}</option>`).join("") || `<option value="">ይህ ፅዋ ማህበር አባል የለውም</option>`;
}
function firstMemberOf(committeeId){
  const mem = DB.members.find(m=>m.committeeId===committeeId);
  return mem ? mem.id : "";
}
function unpaidMonthsOf(memberId){
  const m = memberById(memberId);
  if(!m) return [];
  const startY = DB.settings.trackingStartYear || 2018, startM = "ጥቅምት";
  const curY = DB.settings.currentYear, curM = DB.settings.currentMonth;
  let out = [];
  for(let v=monthIdx(startY,startM); v<=monthIdx(curY,curM); v++){
    const y = Math.floor(v/13), mo = ETH_MONTHS[v%13];
    const paid = DB.payments.some(p=>p.memberId===memberId && p.year===y && p.month===mo);
    if(!paid) out.push({y,mo});
  }
  return out;
}
function unpaidMonthsChips(memberId){
  if(!memberId) return "";
  const unpaid = unpaidMonthsOf(memberId);
  if(unpaid.length===0) return `<div style="font-size:12px;color:#2E6B3C;margin:-4px 0 12px;">🎉 ይህ አባል ያልከፈለበት ወር የለም — ተከታትሏል!</div>`;
  return `<div style="margin:-4px 0 14px;">
    <div style="font-size:12px;color:var(--red);font-weight:700;margin-bottom:6px;">❗ ያልከፈለባቸው ${unpaid.length} ወራት (ተጭነው ይምረጡ)፦</div>

    </div>
  </div>`;
}

function recentPaymentsGrouped(recent){
  const byCommittee = {};
  recent.forEach(p=>{
    const m = memberById(p.memberId);
    const cid = m ? m.committeeId : "unknown";
    byCommittee[cid] = byCommittee[cid] || [];
    byCommittee[cid].push(p);
  });
  const committeeOrder = DB.committees.map(c=>c.id);
  const order = Object.keys(byCommittee).sort((a,b)=> committeeOrder.indexOf(a) - committeeOrder.indexOf(b));
  if(order.length===0) return `<div class="empty-state">ክፍያ የለም</div>`;
  return order.map(cid=>{
    const c = committeeById(cid);
    const items = sortByEntryThenMonth(byCommittee[cid]);
    return `<div style="margin-bottom:12px;">
      <div style="font-size:12.5px;font-weight:800;color:var(--gold);margin:8px 0 4px;">📚 ${c?c.name:'ያልታወቀ ፅዋ ማህበር'}</div>
      ${items.map(p=>{ const m=memberById(p.memberId); return `
        <div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;">
          <div><b>${m?m.name:'የተሰረዘ አባል'}</b><div style="font-size:11.5px;color:var(--muted)">${p.month} ${p.year}${p.enteredAt?' • '+fmtEntryTime(p.enteredAt):''}</div></div>
          <div style="display:flex;align-items:center;gap:8px;"><span class="amt-pos">${fmtNum(p.amount)} ብር</span>
          <button class="btn btn-outline btn-sm btn-icon" onclick="openReceipt('${p.id}')" title="ደረሰኝ">🧾</button>
          <button class="btn btn-danger btn-sm btn-icon" onclick="deletePayment('${p.id}')">🗑</button></div>
        </div>`;}).join("")}
    </div>`;
  }).join("");
}
var IS_SUBMITTING = false;
async function submitPayment(){
  if(IS_SUBMITTING) return;
  const memberId = document.getElementById("pMember").value;
  const month = document.getElementById("pMonth").value;
  const year = Number(document.getElementById("pYear").value);
  const amount = Number(document.getElementById("pAmount").value);
  const note = document.getElementById("pNote").value.trim();
  if(!memberId || !amount){ showToast("እባክዎ ሁሉንም መረጃ ይሙሉ"); return; }
  STATE.paymentMember = memberId;
  const existing = DB.payments.filter(p=>p.memberId===memberId && p.month===month && p.year===year);
  if(existing.length>0){
    const mName = memberById(memberId)?.name || "";
    const listStr = existing.map(p=>fmtNum(p.amount)+" ብር").join("፣ ");
    const msg = `⚠️ ${mName} ለ${month} ${year} ቀድሞ ${existing.length>1?existing.length+' ግቤቶች':'ክፍያ'} (${listStr}) ተመዝግቧል። ይህን አዲስ ${fmtNum(amount)} ብር ተጨማሪ አድርገው መመዝገብ ይፈልጋሉ?`;
    if(!(await askConfirm(msg, "✓ አዎ፣ ጨምር"))) return;
  }
  IS_SUBMITTING = true;
  DB.payments.push({ id: uid("p"), memberId, month, year, amount, note, enteredAt: Date.now() });
  logActivity(`${fmtNum(amount)} ብር ክፍያ ለ${memberById(memberId)?.name||"አባል"} (${month} ${year}) መዘገበ`);
  scheduleSave(); buzz(20); showToast("ክፍያው ተመዝግቧል ✓"); renderApp();
  setTimeout(()=>{ IS_SUBMITTING = false; }, 1200);
}
async function deletePayment(id){
  if(!(await askConfirm("ይህን ክፍያ መሰረዝ ይፈልጋሉ?"))) return;
  DB.payments = DB.payments.filter(p=>p.id!==id);

}

function toggleAllCommittees(all){

function toggleCommittee(id, checked){

function reportModeFields(range){

function changeReportMode(mode){

  else if(mode==="year") STATE.reportRange = { year: DB.settings.currentYear };
  else STATE.reportRange = { from:{y:DB.settings.currentYear,m:"ጥቅምት"}, to:{y:DB.settings.currentYear,m:DB.settings.currentMonth} };

function applyReportRange(){
  const r = STATE.reportRange;

  if(r.from && document.getElementById("rFromY")){

function reportTable(range, committeeIds){
  const ids = committeeIds || DB.committees.map(c=>c.id);
  const rows = DB.committees.filter(c=>ids.includes(c.id)).map(c=>{
    const mem = committeeMembers(c.id);
    const memIds = mem.map(m=>m.id);
    const inc = DB.payments.filter(p=>memIds.includes(p.memberId) && inRange(p.year,p.month,range)).reduce((a,p)=>a+p.amount,0);
    let debt=0, over=0;
    mem.forEach(m=>{ const st=memberStats(m); debt+=st.debt; over+=st.overpay; });
    return { name:c.name, count:mem.length, inc, debt, over };
  });
  const totMembers = rows.reduce((a,r)=>a+r.count,0);
  const totInc = rows.reduce((a,r)=>a+r.inc,0);
  const totDebt = rows.reduce((a,r)=>a+r.debt,0);
  const totOver = rows.reduce((a,r)=>a+r.over,0);
  return `<div class="table-wrap ${STATE.wide?'wide-mode':''}"><table class="data-table">
    <thead><tr><th class="name-cell">ፅዋ ማህበር</th><th>አባላት</th><th>ገቢ (ለተመረጠው ጊዜ)</th><th>ውዝፍ (እስከ አሁን)</th><th>ትርፍ (እስከ አሁን)</th></tr></thead>
    <tbody>
    ${rows.map(r=>`<tr><td class="name-cell">${r.name}</td><td>${r.count}</td><td>${fmtNum(r.inc)}</td>
      <td>${r.debt>0?`<span class="amt-neg">${fmtNum(r.debt)}</span>`:'—'}</td>
      <td>${r.over>0?`<span class="amt-over">${fmtNum(r.over)}</span>`:'—'}</td></tr>`).join("") || `<tr><td colspan="5"><div class="empty-state">ምንም ፅዋ ማህበር አልተመረጠም</div></td></tr>`}
    ${rows.length? `<tr style="background:var(--sidebar);color:#fff;font-weight:800;"><td class="name-cell">ጠቅላላ ድምር</td><td>${totMembers}</td><td>${fmtNum(totInc)}</td><td>${fmtNum(totDebt)}</td><td>${fmtNum(totOver)}</td></tr>`:""}
    </tbody></table></div>`;
}
function reportMemberDetailTable(committeeIds){
  const ids = committeeIds || DB.committees.map(c=>c.id);
  const scopeMemberIds = DB.members.filter(m=>ids.includes(m.committeeId)).map(m=>m.id);
  // collect every distinct year+month period actually paid across the selected
  // committees, in chronological order — this becomes the column set.
  const periodsSet = new Set();
  DB.payments.forEach(p=>{
    if(scopeMemberIds.includes(p.memberId)) periodsSet.add(p.year + "|" + p.month);
  });
  const periods = [...periodsSet].map(s=>{ const [y,m]=s.split("|"); return {y:Number(y), m}; })
    .sort((a,b)=> monthIdx(a.y, a.m==="ዓመታዊ"?"መስከረም":a.m) - monthIdx(b.y, b.m==="ዓመታዊ"?"መስከረም":b.m));

  let out = "";
  DB.committees.filter(c=>ids.includes(c.id)).forEach(c=>{
    const mem = committeeMembers(c.id);
    if(mem.length===0) return;
    let committeeTotal = 0, committeeDebt = 0;
    out += `<h4 style="color:#A33A2E;margin:18px 0 6px;">${c.name}</h4>
      <table><thead><tr><th>ተ.ቁ</th><th style="text-align:right">ስም</th>
      ${periods.map(p=>`<th>${p.m==="ዓመታዊ" ? p.y+" ዓ.ም" : p.m+" "+p.y}</th>`).join("")}
      <th>ድምር</th><th>ውዝፍ ዕዳ</th></tr></thead><tbody>`;
    mem.forEach((m,i)=>{
      const st = memberStats(m);
      const memPays = paymentsOf(m.id);
      committeeTotal += st.paid; committeeDebt += st.debt;
      out += `<tr><td>${i+1}</td><td style="text-align:right">${escHtml(m.name)}</td>`;
      periods.forEach(p=>{
        const pay = memPays.find(x=>x.year===p.y && x.month===p.m);
        out += `<td>${pay ? fmtNum(pay.amount) : "—"}</td>`;
      });
      out += `<td><b>${fmtNum(st.paid)}</b></td><td>${st.debt>0?fmtNum(st.debt):"—"}</td></tr>`;
    });
    out += `<tr style="background:#f2ecd8;font-weight:800;"><td colspan="2" style="text-align:right">ጠቅላላ ድምር</td>
      ${periods.map(p=>{
        const sum = mem.reduce((a,m)=>{ const pay=paymentsOf(m.id).find(x=>x.year===p.y&&x.month===p.m); return a+(pay?pay.amount:0); },0);
        return `<td>${sum>0?fmtNum(sum):"—"}</td>`;
      }).join("")}
      <td>${fmtNum(committeeTotal)}</td><td>${fmtNum(committeeDebt)}</td></tr>`;
    out += `</tbody></table>`;
  });
  return out || `<p>ምንም ፅዋ ማህበር አልተመረጠም</p>`;
}

// rangeArg/selArg/cidsArg let callers (e.g. the Dashboard's full export
// buttons) generate a report without touching/depending on the Report page's
// STATE — if omitted, falls back to whatever the Report page currently has.
function buildReportHtml(rangeArg, selArg, cidsArg){

      .printbar button{background:#C9962B;color:#1c3320;border:none;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer;}
      @media print{ .printbar{display:none;} table{font-size:9.5px;} th,td{padding:3px 5px;} }
    </style></head><body>
    <div class="printbar no-print">
      <button onclick="window.print()">🖨️ አትም / Save as PDF</button>
      <span style="font-size:11.5px;color:#6e5115;margin-right:10px;">👆 ይህን ተጭነው “Save as PDF” ይምረጡ</span>
    </div>
    <div style="text-align:center;"><img src="${LOGO_DATA_URI}" alt="ሎጎ" style="width:70px;height:70px;border-radius:50%;object-fit:cover;"></div>

    <h4 style="text-align:center;">የገንዘብ ሪፖርት — ${rangeLabel}</h4>
    ${sel.summary ? `<div class="meta">

      ወጪ (ለተመረጠው ጊዜ)፦ <b>${fmtBirr(periodExpense(range))}</b> &nbsp;|&nbsp;
      ከወጪ በኋላ ቀሪ (ጠቅላላ ቀሪ ሂሳብ)፦ <b>${fmtBirr(netBalance())}</b> &nbsp;|&nbsp;
      ውዝፍ ዕዳ (ከምስረታ ጀምሮ)፦ <b>${fmtBirr(totalDebt())}</b>

// Blob URLs (unlike data: URIs) are allowed for top-level new-tab navigation
// in Chrome, which is why we build these with Blob + createObjectURL instead
// of data:... — data: URI navigation is blocked by modern browsers.
function reportPrintHref(rangeArg, selArg, cidsArg){
  const blob = new Blob([buildReportHtml(rangeArg, selArg, cidsArg)], { type: "text/html" });
  return URL.createObjectURL(blob);
}
function reportWordHref(rangeArg, selArg, cidsArg){
  const html = buildReportHtml(rangeArg, selArg, cidsArg).replace('<button onclick="window.print()">🖨️ አትም / Save as PDF</button>','').replace(/<div class="printbar[^>]*>[\s\S]*?<\/div>/,'');
  const blob = new Blob(['\ufeff' + html], { type: "application/msword" });
  return URL.createObjectURL(blob);
}
// True PDF file generation (separate from the "open to print" option above),
// using html2pdf.js loaded on demand from cdnjs. Falls back to a clear
// message pointing at the Print option if the library can't load (e.g. no
// network, or a strict sandbox blocking the script fetch).
// Reliable PDF path: open the print-ready view in a new tab (Blob URL — works
// even when the parent iframe sandbox blocks things) and auto-trigger the
// print dialog immediately, so the person only has to pick "Save as PDF".
// (The earlier html2pdf.js/cdnjs approach depended on loading an external
// script, which this sandbox sometimes blocks — this version has zero
// external dependencies, so it always works.)
function reportPdfHref(rangeArg, selArg, cidsArg){
  const html = buildReportHtml(rangeArg, selArg, cidsArg).replace(
    "</body>",
    "<script>window.addEventListener('load',function(){ setTimeout(function(){ window.print(); }, 400); });<\/script></body>"
  );
  const blob = new Blob([html], { type: "text/html" });
  return URL.createObjectURL(blob);
}
// Full, all-committee, all-time export used by the Dashboard's "download
// everything" buttons — always includes summary + committee totals + the
// full per-member monthly breakdown, regardless of what the Report page's
// own filters are currently set to.
function fullExportParams(){
  return [{allTime:true}, {summary:true, table:true, members:true}, DB.committees.map(c=>c.id)];
}
function downloadDashboardPdf(){
  try{
    const [range, sel, cids] = fullExportParams();
    const url = reportPdfHref(range, sel, cids);
    // An <a target="_blank"> click is honored by far more browsers/sandboxes
    // (including embedded iframes on free hosting sites) than a bare
    // window.open() call, which many popup blockers silently swallow.
    const a = document.createElement("a");
    a.href = url; a.target = "_blank"; a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    showToast("📕 PDF በአዲስ ትር ተከፍቷል — ትር ካልተከፈተ የገጹን pop-up ማገጃ (popup blocker) ያጥፉ");
    logActivity("ሙሉ ሪፖርት (PDF) አወረደ");
  }catch(err){
    console.error("PDF export failed:", err);
    showToast("⚠️ PDF ማዘጋጀት አልተሳካም። እባክዎ 🖨️ ማተሚያ ዕይታ ክፈት የሚለውን ከ📄ሪፖርት ገጽ ይሞክሩ፣ ወይም ገጹን ዳግም ይክፈቱ (refresh)።");
  }
}
function downloadDashboardWord(){
  try{
    const [range, sel, cids] = fullExportParams();
    const url = reportWordHref(range, sel, cids);
    const a = document.createElement("a");

    logActivity("ሙሉ ሪፖርት (Word) አወረደ");

function downloadReportText(){
  const range = STATE.reportRange || {allTime:true};
  const sel = STATE.reportSel || {summary:true, table:true, members:false};
  const cids = STATE.reportCommittees || DB.committees.map(c=>c.id);
  let out = `${DB.settings.orgName}\nየገንዘብ ሪፖርት — ${reportRangeLabel()}\n${"=".repeat(50)}\n\n`;
  if(sel.summary){
    out += `ገቢ (ለተመረጠው ጊዜ): ${fmtNum(periodIncome(range))} ብር\n`;
    out += `ወጪ (ለተመረጠው ጊዜ): ${fmtNum(periodExpense(range))} ብር\n`;
    out += `ጠቅላላ ቀሪ ሂሳብ (እስከ አሁን): ${fmtNum(netBalance())} ብር\n`;
    out += `ውዝፍ ዕዳ (ከምስረታ ጀምሮ): ${fmtNum(totalDebt())} ብር\n\n`;
  }
  if(sel.table){
    out += `የፅዋ ማህበራት ማጠቃለያ\n${"-".repeat(50)}\n`;
    DB.committees.filter(c=>cids.includes(c.id)).forEach(c=>{
      const s = committeeStats(c.id);
      out += `${c.name}\t አባላት: ${s.count}\t የተከፈለ: ${fmtNum(s.paid)}\t ውዝፍ: ${fmtNum(s.debt)}\t ትርፍ: ${fmtNum(s.overpay)}\n`;
    });
    out += "\n";
  }
  if(sel.members){
    out += `ሙሉ ዝርዝር (በዓመትና በወር)\n${"-".repeat(50)}\n`;
    DB.committees.filter(c=>cids.includes(c.id)).forEach(c=>{
      out += `\n[${c.name}]\n`;
      committeeMembers(c.id).forEach((m,i)=>{
        const st = memberStats(m);
        const memPays = paymentsOf(m.id).slice().sort((a,b)=> monthIdx(a.year,a.month==="ዓመታዊ"?"መስከረም":a.month) - monthIdx(b.year,b.month==="ዓመታዊ"?"መስከረም":b.month));
        out += `${i+1}. ${m.name}\n`;
        memPays.forEach(p=>{
          const label = p.month==="ዓመታዊ" ? `${p.year} ዓ.ም (ዓመታዊ)` : `${p.month} ${p.year}`;
          out += `     ${label}: ${fmtNum(p.amount)} ብር\n`;
        });
        out += `     ጠቅላላ ድምር: ${fmtNum(st.paid)} ብር | ውዝፍ ዕዳ: ${st.debt>0?fmtNum(st.debt):'0'} ብር | ትርፍ ክፍያ: ${st.overpay>0?fmtNum(st.overpay):'0'} ብር\n\n`;
      });
    });
  }
  const blob = new Blob([out], { type: "text/plain;charset=utf-8" });
  triggerDownload(blob, `ሪፖርት_${DB.settings.currentYear}.txt`);
}
function downloadAllData(){

  add("2. ሙሉ የክፍያ መዝገብ (Payments Ledger)");

  DB.payments.slice().sort((a,b)=>monthIdx(a.year,a.month==="ዓመታዊ"?"መስከረም":a.month)-monthIdx(b.year,b.month==="ዓመታዊ"?"መስከረም":b.month)).forEach(p=>{
    const m = memberById(p.memberId); const c = m?committeeById(m.committeeId):null;
    lines.push([c?c.name:"—", m?m.name:"የተሰረዘ አባል", p.month, p.year, p.amount, p.note||""]);
  });
  blank();

  add("3. ሙሉ የወጪ መዝገብ (Expenses Ledger)");
  lines.push(["ምድብ","ወር","ዓመት","መጠን (ብር)","ማብራሪያ"]);
  DB.expenses.forEach(e=> lines.push([e.type, e.month, e.year, e.amount, e.note||""]));
  blank();

  add("4. የድጋፍ ክፍያ መዝገብ (Support Payouts)");
  lines.push(["አባል","ፅዋ ማህበር","አይነት","ወር","ዓመት","መጠን (ብር)","ማብራሪያ"]);
  (DB.supportClaims||[]).forEach(s=>{
    const m = memberById(s.memberId); const c = m?committeeById(m.committeeId):null;
    lines.push([m?m.name:"—", c?c.name:"—", s.claimType, s.month, s.year, s.amount, s.note||""]);
  });
  blank();

  add("5. ጠቅላላ ማጠቃለያ");
  lines.push(["መግለጫ","መጠን (ብር)"]);
  lines.push(["ጠቅላላ የተሰበሰበ", totalCollected()]);
  lines.push(["ጠቅላላ ወጪ (ወጪ + የድጋፍ ክፍያ)", totalExpense()]);
  lines.push(["ጠቅላላ ቀሪ ሂሳብ", netBalance()]);
  lines.push(["ውዝፍ ዕዳ", totalDebt()]);
  lines.push(["ትርፍ ክፍያ", totalOverpay()]);
  lines.push(["ተዘጋጀበት ቀን", `${DB.settings.currentMonth} ${DB.settings.currentYear} ዓ.ም (≈ ${gregApprox(DB.settings.currentYear, DB.settings.currentMonth)})`]);

  const csv = "\ufeff" + lines.map(r=>r.map(csvEscape).join(",")).join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  triggerDownload(blob, `${DB.settings.orgName}_ሙሉ_ውሂብ_${DB.settings.currentYear}.csv`);
  logActivity("ሁሉንም መረጃ (CSV) አወረደ");
  showToast("✅ ሁሉም መረጃ ወርዷል!");
}
function csvEscape(v){
  const s = String(v==null?"":v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function downloadReportCsv(cidsArg, selArg, filenameArg){
  const cids = cidsArg || STATE.reportCommittees || DB.committees.map(c=>c.id);
  const sel = selArg || STATE.reportSel || {summary:true, table:true, members:false};
  const scopeMemberIds = DB.members.filter(m=>cids.includes(m.committeeId)).map(m=>m.id);
  let periods = [];
  if(sel.members){
    const periodsSet = new Set();
    DB.payments.forEach(p=>{ if(scopeMemberIds.includes(p.memberId)) periodsSet.add(p.year+"|"+p.month); });
    periods = [...periodsSet].map(s=>{ const [y,m]=s.split("|"); return {y:Number(y), m}; })
      .sort((a,b)=> monthIdx(a.y, a.m==="ዓመታዊ"?"መስከረም":a.m) - monthIdx(b.y, b.m==="ዓመታዊ"?"መስከረም":b.m));
  }
  const rows = [];
  if(sel.summary){
    rows.push(["ጠቅላላ ማጠቃለያ (ሙሉ ጊዜ)"]);
    rows.push(["ገቢ (ብር)", totalCollected()]);
    rows.push(["ወጪ (ብር)", totalExpense()]);
    rows.push(["ከወጪ በኋላ ቀሪ (ብር)", netBalance()]);
    rows.push(["ውዝፍ ዕዳ (ብር)", totalDebt()]);
    rows.push(["ትርፍ ክፍያ (ብር)", totalOverpay()]);
    rows.push([]);
  }
  if(sel.table){
    rows.push(["ፅዋ ማህበር","አባላት","ገቢ (ብር)","ውዝፍ ዕዳ (ብር)","ትርፍ ክፍያ (ብር)"]);
    DB.committees.filter(c=>cids.includes(c.id)).forEach(c=>{
      const s = committeeStats(c.id);
      rows.push([c.name, s.count, s.paid, s.debt||"", s.overpay||""]);
    });
    rows.push([]);
  }
  const periodLabels = periods.map(p=> p.m==="ዓመታዊ" ? `${p.y} ዓ.ም` : `${p.m} ${p.y}`);
  if(sel.members){
    rows.push(["ፅዋ ማህበር","የአባል ስም", ...periodLabels, "ጠቅላላ ድምር (ብር)","ውዝፍ ዕዳ (ብር)","ትርፍ ክፍያ (ብር)"]);
    DB.committees.filter(c=>cids.includes(c.id)).forEach(c=>{
      committeeMembers(c.id).forEach(m=>{
        const st = memberStats(m);
        const memPays = paymentsOf(m.id);
        const periodVals = periods.map(p=>{
          const pay = memPays.find(x=>x.year===p.y && x.month===p.m);
          return pay ? pay.amount : "";
        });
        rows.push([c.name, m.name, ...periodVals, st.paid, st.debt||"", st.overpay||""]);
      });
    });
  }
  const csv = "\ufeff" + rows.map(r=>r.map(csvEscape).join(",")).join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  triggerDownload(blob, filenameArg || `ሪፖርት_${DB.settings.currentYear}.csv`);
}
function downloadDashboardExcel(){
  const cids = DB.committees.map(c=>c.id);
  downloadReportCsv(cids, {summary:true, table:true, members:true}, `${DB.settings.orgName}_ሙሉ_ሪፖርት_${DB.settings.currentYear}.csv`);
  logActivity("ሙሉ ሪፖርት (Excel/CSV) አወረደ");
}
function triggerDownload(blob, filename){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

async function submitAnnouncement(){
  const title = document.getElementById("anTitle").value.trim();
  const text = document.getElementById("anText").value.trim();
  const pinned = document.getElementById("anPinned").checked;
  if(!title || !text){ showToast("ርዕስ እና ዝርዝር ያስፈልጋሉ"); return; }
  DB.announcements = DB.announcements || [];
  DB.announcements.push({ id: uid("an"), title, text, pinned, date: new Date().toLocaleDateString("am-ET"), createdAt: Date.now() });
  logActivity(`📢 ማስታወቂያ "${title}" ለጠፈ`);
  scheduleSave(); buzz(20); showToast("ማስታወቂያው ተለጥፏል ✓"); renderApp();
}
function toggleAnnouncementPin(id){
  const a = (DB.announcements||[]).find(x=>x.id===id);
  if(a){ a.pinned = !a.pinned; scheduleSave(); renderApp(); }
}
async function deleteAnnouncement(id){
  if(!(await askConfirm("ይህን ማስታወቂያ መሰረዝ ይፈልጋሉ?"))) return;
  DB.announcements = (DB.announcements||[]).filter(a=>a.id!==id);
  scheduleSave(); renderApp();
}

    </div>` : ""}

async function submitMeeting(){
  const title = document.getElementById("mtTitle").value.trim();
  const month = document.getElementById("mtMonth").value;
  const year = Number(document.getElementById("mtYear").value);
  const notes = document.getElementById("mtNotes").value.trim();
  if(!title || !notes){ showToast("ርዕስ እና ማስታወሻ ያስፈልጋሉ"); return; }
  DB.meetings = DB.meetings || [];
  DB.meetings.push({ id: uid("mt"), title, month, year, notes, createdAt: Date.now() });
  logActivity(`📝 የስብሰባ መዝገብ "${title}" (${month} ${year}) ጨመረ`);
  scheduleSave(); buzz(20); showToast("የስብሰባ መዝገቡ ተቀምጧል ✓"); renderApp();
}
async function deleteMeeting(id){
  if(!(await askConfirm("ይህን የስብሰባ መዝገብ መሰረዝ ይፈልጋሉ?"))) return;
  DB.meetings = (DB.meetings||[]).filter(mt=>mt.id!==id);
  scheduleSave(); renderApp();
}

function openReceipt(paymentId){
  const p = DB.payments.find(x=>x.id===paymentId);
  if(!p){ showToast("ክፍያው አልተገኘም"); return; }
  const m = memberById(p.memberId);
  const c = m ? committeeById(m.committeeId) : null;
  // sequential receipt number derived from position in the full ledger (stable, chronological by entry)
  const allSorted = DB.payments.slice().sort((a,b)=>(a.enteredAt||0)-(b.enteredAt||0));
  const receiptNo = "RCP-" + String(allSorted.findIndex(x=>x.id===paymentId)+1).padStart(5,"0");
  const issuedOn = new Date().toLocaleDateString("am-ET");
  const html = `<!DOCTYPE html><html lang="am"><head><meta charset="utf-8"><title>ደረሰኝ ${receiptNo}</title>
    <style>
      body{font-family:'Noto Sans Ethiopic','Nyala',sans-serif;background:#f4f4f4;margin:0;padding:24px;}
      .receipt{max-width:520px;margin:0 auto;background:#fff;border:2px solid #163A24;border-radius:10px;padding:28px;}
      .rhead{text-align:center;border-bottom:3px double #163A24;padding-bottom:14px;margin-bottom:18px;}
      .rhead h2{color:#163A24;margin:0 0 2px;font-size:19px;}
      .rhead p{color:#A33A2E;margin:0;font-weight:700;font-size:13px;}
      .rno{font-size:12px;color:#888;margin-top:6px;}
      table{width:100%;border-collapse:collapse;margin:16px 0;}
      td{padding:8px 4px;font-size:14px;border-bottom:1px solid #eee;}
      td.lbl{color:#666;width:40%;}
      td.val{font-weight:700;color:#222;text-align:left;}
      .amt-box{background:#FBF0DC;border:1.5px solid #C9962B;border-radius:8px;padding:14px;text-align:center;margin:18px 0;}
      .amt-box .n{font-size:26px;font-weight:800;color:#163A24;}
      .sig{display:flex;justify-content:space-between;margin-top:36px;font-size:12px;}
      .sig div{width:45%;border-top:1px solid #999;padding-top:6px;text-align:center;color:#666;}
      .printbar{text-align:center;margin-bottom:16px;}
      .printbar button{background:#C9962B;border:none;border-radius:8px;padding:10px 22px;font-size:14px;font-weight:700;cursor:pointer;}
      @media print{ .printbar{display:none;} body{background:#fff;padding:0;} .receipt{border:none;} }
    </style></head><body>
    <div class="printbar"><button onclick="window.print()">🖨️ አትም / Save as PDF</button></div>
    <div class="receipt">
      <div class="rhead">
        <img src="${LOGO_DATA_URI}" alt="ሎጎ" style="width:64px;height:64px;border-radius:50%;object-fit:cover;margin-bottom:8px;">
        <h2>${DB.settings.orgName}</h2>
        <p>ኦፊሴላዊ የክፍያ ደረሰኝ</p>
        <div class="rno">ደረሰኝ ቁጥር፦ ${receiptNo} &nbsp;|&nbsp; የተዘጋጀበት ቀን፦ ${issuedOn}</div>
      </div>
      <table>
        <tr><td class="lbl">ከ (ስም)፦</td><td class="val">${escHtml(m?m.name:"—")}</td></tr>
        <tr><td class="lbl">ፅዋ ማህበር፦</td><td class="val">${escHtml(c?c.name:"—")}</td></tr>
        <tr><td class="lbl">የክፍያ ወር፦</td><td class="val">${p.month} ${p.year} ዓ.ም ${p.month!=="ዓመታዊ"?"(≈ "+gregApprox(p.year,p.month)+")":""}</td></tr>
        ${p.note? `<tr><td class="lbl">ማስታወሻ፦</td><td class="val">${escHtml(p.note)}</td></tr>` : ""}
      </table>
      <div class="amt-box">
        <div style="font-size:12px;color:#8A6112;">የተከፈለ መጠን</div>
        <div class="n">${fmtNum(p.amount)} ብር</div>
      </div>
      <div class="sig">
        <div>የከፋይ ፊርማ</div>
        <div>የገንዘብ ያዥ ፊርማ</div>

function refreshSupportMembers(){
  const cid = document.getElementById("spCommittee").value;
  document.getElementById("spMember").innerHTML = paymentMemberOptions(cid);
}
async function submitSupport(){
  if(IS_SUBMITTING) return;
  const memberId = document.getElementById("spMember").value;
  const claimType = document.getElementById("spType").value;
  const month = document.getElementById("spMonth").value;
  const year = Number(document.getElementById("spYear").value);
  const amount = Number(document.getElementById("spAmount").value);
  const note = document.getElementById("spNote").value.trim();
  if(!memberId || !amount){ showToast("እባክዎ አባል እና መጠን ያስገቡ"); return; }
  if(!(await askConfirm(`🕊️ ${fmtNum(amount)} ብር የ${claimType} ክፍያ ለ${memberById(memberId)?.name} እንዲመዘገብ ያረጋግጡ`, "✓ አዎ፣ መዝግብ"))) return;
  IS_SUBMITTING = true;
  DB.supportClaims = DB.supportClaims || [];
  DB.supportClaims.push({ id: uid("sp"), memberId, claimType, month, year, amount, note, enteredAt: Date.now() });
  logActivity(`🕊️ ${fmtNum(amount)} ብር ${claimType} ለ${memberById(memberId)?.name||"አባል"} መዘገበ`);
  scheduleSave(); buzz(20); showToast("የድጋፍ ክፍያው ተመዝግቧል 🕊️"); renderApp();
  setTimeout(()=>{ IS_SUBMITTING = false; }, 1200);
}
async function deleteSupport(id){
  if(!(await askConfirm("ይህን የድጋፍ ክፍያ መዝገብ መሰረዝ ይፈልጋሉ?"))) return;
  DB.supportClaims = (DB.supportClaims||[]).filter(s=>s.id!==id);
  logActivity("አንድ የድጋፍ ክፍያ መዝገብ ሰረዘ");
  scheduleSave(); renderApp();
}

async function submitComment(){
  const author = document.getElementById("cmName").value.trim();
  const text = document.getElementById("cmText").value.trim();
  if(!author || !text){ showToast("ስምና አስተያየት ያስፈልጋሉ"); return; }
  DB.comments = DB.comments || [];
  DB.comments.push({ id: uid("cm"), author, role: STATE.role, text, date: new Date().toLocaleDateString("am-ET") });

// The app's owner/developer account is always DB.admins[0] (the account
// originally set up when the app was built). Only that logged-in admin may
// view the full admin list, add/remove admins, or reset someone else's PIN.
// Everyone else may only manage their own row — and even then, never sees
// the existing PIN value, only ever sets a brand-new one.
function isOwnerAdmin(){
  return !!(DB.admins[0] && STATE.currentAdminId === DB.admins[0].id);
}
// Strips the pin before handing an admin record to the UI/HTML, so the
// actual PIN is never embedded in the page source (e.g. inside an onclick
// attribute), not even for rows the owner is allowed to manage.
function adminPublicInfo(a){
  return { id: a.id, name: a.name, phone: a.phone||"", email: a.email||"" };
}

    <div class="modal-actions"><button class="btn btn-primary" style="flex:1" onclick="saveAdmin('${a.id}')">አስቀምጥ</button><button class="btn btn-outline" onclick="closeModal()">ይቅር</button></div>`);

async function saveAdmin(id){
  const isSelf = id === STATE.currentAdminId;
  if(id && !isOwnerAdmin() && !isSelf){ showToast("ፈቃድ የለዎትም"); return; }
  if(!id && !isOwnerAdmin()){ showToast("ይህን ማድረግ የሚችሉት የመተግበሪያው ባለቤት ብቻ ነው"); return; }
  const name = document.getElementById("aName").value.trim();
  const phone = document.getElementById("aPhone").value.trim();
  const email = document.getElementById("aEmail").value.trim();
  const pin = document.getElementById("aPin").value.trim();
  if(id){
    const a = DB.admins.find(x=>x.id===id);
    if(isOwnerAdmin()){ if(!name){ showToast("ስም ያስፈልጋል"); return; } a.name=name; a.phone=phone; a.email=email; }
    if(pin){
      const salt = randomSalt();
      a.pinHash = await hashPin(pin, salt);
      a.salt = salt;
    } else if(!a.pinHash){ showToast("ፒን ያስፈልጋል"); return; }
  } else {
    if(!name||!pin){ showToast("ስም እና ፒን ያስፈልጋሉ"); return; }
    const salt = randomSalt();
    const pinHash = await hashPin(pin, salt);
    DB.admins.push({ id: uid("a"), name, phone, email, salt, pinHash });
  }
  scheduleSave(); closeModal(); showToast("ተቀምጧል ✓"); renderApp();
}
async function deleteAdmin(id){
  if(!isOwnerAdmin()){ showToast("ይህን ማድረግ የሚችሉት የመተግበሪያው ባለቤት ብቻ ነው"); return; }
  if(DB.admins[0] && id===DB.admins[0].id){ showToast("የመተግበሪያውን ባለቤት መለያ መሰረዝ አይቻልም"); return; }
  if(DB.admins.length<=1){ showToast("ቢያንስ አንድ አድሚን መኖር አለበት"); return; }
  if(!(await askConfirm("ይህን አድሚን መሰረዝ ይፈልጋሉ?"))) return;
  DB.admins = DB.admins.filter(a=>a.id!==id);
  scheduleSave(); renderApp();
}
function scanDuplicates(){
  const payGroups = {};
  DB.payments.forEach(p=>{
    const key = `${p.memberId}|${p.month}|${p.year}|${p.amount}`;
    payGroups[key] = payGroups[key] || [];
    payGroups[key].push(p);
  });
  const expGroups = {};
  DB.expenses.forEach(e=>{
    const key = `${e.type}|${e.month}|${e.year}|${e.amount}`;
    expGroups[key] = expGroups[key] || [];
    expGroups[key].push(e);
  });
  const dupPay = Object.values(payGroups).filter(g=>g.length>1);
  const dupExp = Object.values(expGroups).filter(g=>g.length>1);
  const extraPayCount = dupPay.reduce((a,g)=>a+g.length-1,0);
  const extraExpCount = dupExp.reduce((a,g)=>a+g.length-1,0);
  const extraPaySum = dupPay.reduce((a,g)=>a+g.slice(1).reduce((x,p)=>x+p.amount,0),0);
  const extraExpSum = dupExp.reduce((a,g)=>a+g.slice(1).reduce((x,e)=>x+e.amount,0),0);

  const monthGroups = {};
  DB.payments.forEach(p=>{
    const key = `${p.memberId}|${p.month}|${p.year}`;
    monthGroups[key] = monthGroups[key] || [];
    monthGroups[key].push(p);
  });
  const reviewGroups = Object.entries(monthGroups).filter(([k,g])=>g.length>1 && new Set(g.map(p=>p.amount)).size>1);

  if(dupPay.length===0 && dupExp.length===0 && reviewGroups.length===0){
    document.getElementById("dupResults").innerHTML = `<div class="empty-state">🎉 ምንም ድግግሞሽ አልተገኘም!</div>`;
    return;
  }
  document.getElementById("dupResults").innerHTML = `
    <div style="margin-top:12px;">
      ${dupPay.length? `<p style="font-size:13px;">💳 <b>${dupPay.length}</b> ትክክለኛ ድግግሞሽ (ተመሳሳይ አባል+ወር+መጠን) ተገኝተዋል (ተጨማሪ <b>${extraPayCount}</b> ግቤቶች = <b>${fmtNum(extraPaySum)} ብር</b>)</p>`:""}
      ${dupExp.length? `<p style="font-size:13px;">🧾 <b>${dupExp.length}</b> የወጪ ድግግሞሾች ተገኝተዋል (ተጨማሪ <b>${extraExpCount}</b> ግቤቶች = <b>${fmtNum(extraExpSum)} ብር</b>)</p>`:""}

async function cleanDuplicates(){
  if(!(await askConfirm("ይህ ተግባር ተመላሽ የለውም። መጀመሪያ '⬇ የመጠባበቂያ ፋይል አውርድ' አድርገዋል? ለመቀጠል እርግጠኛ ነዎት?", "✓ አዎ፣ አጽዳ"))) return;
  const seenPay = new Set(); const keepPayments = [];
  DB.payments.forEach(p=>{
    const key = `${p.memberId}|${p.month}|${p.year}|${p.amount}`;
    if(seenPay.has(key)) return;
    seenPay.add(key); keepPayments.push(p);
  });
  const seenExp = new Set(); const keepExpenses = [];
  DB.expenses.forEach(e=>{
    const key = `${e.type}|${e.month}|${e.year}|${e.amount}`;
    if(seenExp.has(key)) return;
    seenExp.add(key); keepExpenses.push(e);
  });
  DB.payments = keepPayments; DB.expenses = keepExpenses;
  await saveDB(); showToast("✓ ድግግሞሾች ጸድተዋል"); document.getElementById("dupResults").innerHTML=""; renderApp();
}
function backupHref(){
  const blob = new Blob([JSON.stringify(DB,null,2)], { type: "application/json" });
  return URL.createObjectURL(blob);
}

function doRestore(){
  const f = document.getElementById("restoreFile").files[0];
  if(!f){ showToast("እባክዎ ፋይል ይምረጡ"); return; }
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const data = JSON.parse(e.target.result);
      if(!Array.isArray(data.members) || !Array.isArray(data.committees) || !Array.isArray(data.payments)){
        throw new Error("invalid structure");
      }
      if(!Array.isArray(data.admins) || data.admins.length===0){ throw new Error("no admins - refusing to lock you out"); }
      data.expenses = Array.isArray(data.expenses) ? data.expenses : [];
      data.comments = Array.isArray(data.comments) ? data.comments : [];
      data.settings = data.settings && typeof data.settings === "object" ? data.settings : DB.settings;
      DB = data;
      await fixupAdminPinHashes(); // in case the restored file predates PIN hashing
      await saveDB(); showToast("መረጃው ተመልሷል ✓"); renderApp();
    }catch(err){ console.error(err); showToast("ፋይሉ ትክክል አይደለም ወይም አድሚን የለውም — ወደነበረው ሁኔታ ምንም አልተቀየረም"); }
  };
  reader.readAsText(f);
}

// Additive-only import: adds any record whose id is not already present in
// the live DB, across every list-type collection. Never deletes, never
// overwrites an existing record, and never touches admin PINs — safe to run
// repeatedly (e.g. syncing two copies that were both used for a while).
async function doMergeImport(){
  const f = document.getElementById("mergeFile").files[0];
  if(!f){ showToast("እባክዎ ፋይል ይምረጡ"); return; }
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const incoming = JSON.parse(e.target.result);
      const counts = {};
      const mergeList = (key) => {
        if(!Array.isArray(incoming[key])) return;
        DB[key] = DB[key] || [];
        const existingIds = new Set(DB[key].map(x=>x.id));
        let added = 0;
        incoming[key].forEach(item=>{
          if(item && item.id && !existingIds.has(item.id)){
            DB[key].push(item); existingIds.add(item.id); added++;
          }
        });
        if(added>0) counts[key] = added;
      };
      ["committees","members","payments","expenses","supportClaims","comments","announcements","meetings","activityLog"].forEach(mergeList);
      // Admins: add any admin the live DB doesn't already have (matched by
      // phone if present, else by name) — never overwrite an existing
      // admin's PIN hash through this path.
      if(Array.isArray(incoming.admins)){
        DB.admins = DB.admins || [];
        let addedAdmins = 0;
        incoming.admins.forEach(ia=>{
          const exists = DB.admins.some(a => (ia.phone && a.phone===ia.phone) || a.name===ia.name);
          if(!exists && ia.id){ DB.admins.push(ia); addedAdmins++; }
        });
        if(addedAdmins>0) counts.admins = addedAdmins;
      }
      await fixupAdminPinHashes();
      const totalAdded = Object.values(counts).reduce((a,b)=>a+b,0);
      if(totalAdded===0){
        document.getElementById("mergeResult").innerHTML = `<div style="font-size:12.5px;color:var(--muted);">ℹ️ አዲስ የሚታከል ውሂብ አልተገኘም — ሁለቱም ቅጂዎች አስቀድመው ተመሳሳይ ናቸው።</div>`;
      } else {
        await saveDB();
        const lines = Object.entries(counts).map(([k,v])=>`${v} ${k}`).join("፣ ");
        document.getElementById("mergeResult").innerHTML = `<div style="font-size:12.5px;color:#2E6B3C;font-weight:700;">✅ ${lines} ታክሏል!</div>`;
        logActivity(`🧬 የውሂብ ውህደት (merge) አደረገ: ${lines}`);
        showToast("✅ ውሂብ ተጨምሯል!");
        renderApp();
      }
    }catch(err){
      console.error(err);
      document.getElementById("mergeResult").innerHTML = `<div style="font-size:12.5px;color:var(--red);">⚠️ ፋይሉ ትክክል አይደለም</div>`;
    }
  };
  reader.readAsText(f);
}

          <div style="font-size:38px;margin-bottom:10px;">🔌</div>
          <div style="font-weight:800;color:#163A24;font-size:16px;margin-bottom:8px;">መጫን አልተሳካም</div>
          <p style="font-size:13px;color:#7A7362;margin-bottom:16px;">የኢንተርኔት ግንኙነትዎን ያረጋግጡ እና ገጹን እንደገና ይክፈቱ (refresh)።</p>
          <button onclick="window.location.reload()" style="background:#8FAF93;color:#183021;border:none;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;">🔄 እንደገና ጫን</button>
        </div>
      </div>`;
  }
}
init();

/* ---------------- Font-size / zoom control ---------------- */
// A pure display preference (not part of DB / not synced) so it always
// works instantly, even before data finishes loading, and persists per
// device via plain localStorage. Uses CSS `zoom` (supported by all Chromium
// and modern WebKit/Firefox mobile browsers) so text, padding, and layout
// scale together while normal page scrolling keeps working correctly —
// unlike transform:scale, which can clip or misalign scrollable areas.
const FONT_SCALE_KEY = "edir_font_scale";
const FONT_SCALE_STEPS = [0.8,0.85,0.9,0.95,1,1.1,1.2,1.3,1.4,1.5,1.65,1.8];
function initFontScale(){
  let saved = 1;
  try{ const raw = localStorage.getItem(FONT_SCALE_KEY); if(raw) saved = parseFloat(raw) || 1; }catch(e){}
  applyFontScale(saved);
}
function applyFontScale(scale){
  const wrap = document.getElementById("zoom-wrap");
  if(wrap) wrap.style.zoom = scale;
  const label = document.getElementById("fc-label");
  if(label) label.textContent = Math.round(scale*100) + "%";
  try{ localStorage.setItem(FONT_SCALE_KEY, String(scale)); }catch(e){}
}
function adjustFontScale(dir){
  let current = 1;
  try{ const raw = localStorage.getItem(FONT_SCALE_KEY); if(raw) current = parseFloat(raw) || 1; }catch(e){}
  if(dir===0){ applyFontScale(1); return; }
  let idx = FONT_SCALE_STEPS.reduce((best,v,i)=> Math.abs(v-current) < Math.abs(FONT_SCALE_STEPS[best]-current) ? i : best, 0);
  idx = Math.min(FONT_SCALE_STEPS.length-1, Math.max(0, idx + dir));
  applyFontScale(FONT_SCALE_STEPS[idx]);
}
</script>
